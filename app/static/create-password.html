<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a password · Secure Cloud</title><link rel="stylesheet" href="/static/styles.css"><script defer src="/static/auth.js"></script></head><body><main class="auth-layout"><a class="brand auth-brand" href="/"><span class="brand-mark">S</span> Secure Cloud <span class="brand-muted">Storage</span></a><section class="auth-card"><div class="step-label">GET STARTED · 3 OF 3</div><h1>Choose a password</h1><p class="form-intro">Use at least 12 characters. A long passphrase is easy to remember and hard to guess.</p><form id="password-form"><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required placeholder="At least 12 characters"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required placeholder="Enter it again"><button class="button primary full" type="submit">Create account <span>→</span></button><div class="form-message" role="status" aria-live="polite"></div></form><p class="form-foot">Your password is stored as a one-way Argon2id hash.</p></section><p class="auth-note">Keep your password somewhere safe. We cannot read it back for you.</p></main></body></html>
