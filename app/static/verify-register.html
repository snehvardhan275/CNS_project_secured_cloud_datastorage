<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify email · Secure Cloud</title><link rel="stylesheet" href="/static/styles.css"><script defer src="/static/auth.js"></script></head><body><main class="auth-layout"><a class="brand auth-brand" href="/"><span class="brand-mark">S</span> Secure Cloud <span class="brand-muted">Storage</span></a><section class="auth-card"><div class="step-label">GET STARTED · 2 OF 3</div><h1>Check your inbox</h1><p class="form-intro">Enter the six-digit code we sent to <strong id="register-email-label">your email</strong>.</p><form id="register-verify-form"><label for="otp">Verification code</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000"><button class="button primary full" type="submit">Verify email <span>→</span></button><div class="form-message" role="status" aria-live="polite"></div></form><p class="form-foot">Code expired? <a href="/static/register.html">Start again</a></p></section><p class="auth-note">Codes expire after five minutes. You can request another after one minute.</p></main></body></html>
